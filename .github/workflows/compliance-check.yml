name: Compliance Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check license headers
uses: apache/skywalking-eyes/header@cd7b195c51fd3d6ad52afceb760719ddc6b3ee91  # v0.6.0
        with:
          mode: check
        continue-on-error: false

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scanner
uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64  # main
        with:
          extra_args: --only-verified

  policy-check:
    name: Repository Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Verify required files exist
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            ".gitignore"
            ".github/CODEOWNERS"
            ".github/dependabot.yml"
          )
          missing=()
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required files: ${missing[*]}"
            exit 1
          fi
          echo "All required repository files present."
