name: Feature Request
description: Propose new functionality or an enhancement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the proposed feature with enough detail for the team to evaluate scope and priority.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the proposed feature.
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the preferred approach. Include API sketches, data models, or UI mock-ups where applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches evaluated and why they were not chosen.

  - type: dropdown
    id: gdpr-impact
    attributes:
      label: GDPR Impact
      description: Does this feature involve the processing of personal data?
      options:
        - "No — no personal data involved"
        - "Yes — requires DPIA update"
        - "Uncertain — needs assessment"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Measurable conditions that must be met for this feature to be considered complete.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Links, references, mock-ups, or other supporting material.
