name: Bug Report
description: Report a defect or unexpected behaviour.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provide sufficient detail to allow the team to reproduce and triage the issue.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the observed behaviour versus the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Ordered list of steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Runtime environment (e.g. Python version, OS, deployment target)."
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Output
      description: Relevant log excerpts or stack traces. Redact any sensitive data before pasting.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, related issues, or other supporting information.
